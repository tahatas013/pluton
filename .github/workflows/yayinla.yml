name: Yayınla

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *' # her gün 07:23 (TSİ): yeni setler, lego.tr fiyat ve stokları
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # günlük işin 60 gün sessizlikten sonra kapanmaması için

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: lego.tr fiyat ve stokları
        run: npm run tr
        env:
          PLUTON_LIVE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Set kataloğu (Rebrickable + lego.tr)
        run: npm run catalog
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Günlük işi açık tut
        # GitHub, 60 gün değişiklik olmayan public repolarda zamanlanmış işleri kapatır
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/yayinla.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
